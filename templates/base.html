<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CH-Web</title>
</head>
<body>
    <header>
        {% if user.is_authenticated %}
            <p>
                Вы вошли как {{ user.username }} |
                <a href="{% url 'logout' %}">Выйти</a>
            </p>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
